apiVersion: kafka.strimzi.io/v1beta2

kind: KafkaConnector

metadata:

  name: connector-s3-source

  namespace: kafka

  labels:

    strimzi.io/cluster: my-cluster

spec:

  class: io.confluent.connect.s3.source.S3SourceConnector

  tasksMax: 1

  config:

    key.converter: io.confluent.connect.avro.AvroConverter

    key.converter.schema.registry.url: 'http://schema-registry:8081'

    value.converter: io.confluent.connect.avro.AvroConverter

    value.converter.schema.registry.url: 'http://schema-registry:8081'

    s3.bucket.name: datalakerock-landing-zone-dev-329261866719

    s3.region: us-east-1

    mode: GENERIC

#    topic.regex.list: 'HAPVIDA-TOPIC:AFFIX/BENEFICIARIO/.*\.avro, REPASSE-TOPIC:AFFIX/REPASSE/.*\.avro'
    topic.regex.list: 'test-avro-converter-topic:AFFIX/REPASSE/.*\.avro'

    topics.dir: ' '

    topic.creation.default.replication.factor: 1

    behavior.on.error: log

    topic.creation.default.partitions: 1

    confluent.topic.bootstrap.servers: my-cluster-kafka-bootstrap:9092

    topic.creation.enable: true

    format.class: io.confluent.connect.s3.format.avro.AvroFormat

    confluent.topic.replication.factor: 1
