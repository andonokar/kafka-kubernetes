apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: mongodb-database
  labels:
    app: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
      - name: mongo-express
        image: mongo-express
        ports:
        - containerPort: 8081
        env:
        - name: ME_CONFIG_MONGODB_URL
          value: "mongodb+srv://my-user:senha123@example-mongodb-svc.mongodb-database.svc.cluster.local/admin?replicaSet=example-mongodb&ssl=false"
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express-service
  namespace: mongodb-database
spec:
  selector:
    app: mongo-express
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
