apiVersion: v1
kind: Service
metadata:
  name: example-mongodb-0
  namespace: mongodb-database
spec:
  ports:
  - port: 27017
    protocol: TCP
    targetPort: 27017
  selector:
    statefulset.kubernetes.io/pod-name: example-mongodb-0
  type: LoadBalancer
---
