apiVersion: v1
kind: Pod
metadata:
  name: python-app
  namespace: kafka
  labels:
    name: python-app
spec:
  containers:
  - name: python-app
    image: python:3.10-slim
    command:
      - '/bin/bash'
    args:
      - '-c'
      - "sleep infinity"
    stdin: true
    tty: true
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
      - containerPort: 8080
